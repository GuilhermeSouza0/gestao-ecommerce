
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Cadastro de Produto</h1>

    <form class="form-produto"
          th:action="@{/produtos/salvar}"
          th:object="${produto}" method="post">

        <input type="hidden" th:field="*{id}">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}">
        <small class="erro" th:if="${#fields.hasErrors('nome')}"
               th:errors="*{nome}"></small>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" min="0.01"
               th:field="*{preco}">
        <small class="erro" th:if="${#fields.hasErrors('preco')}"
               th:errors="*{preco}"></small>

        <label for="estoque">Estoque:</label>
        <input type="number" id="estoque" min="0"
               th:field="*{estoque}">
        <small class="erro" th:if="${#fields.hasErrors('estoque')}"
               th:errors="*{estoque}"></small>

        <button type="submit">Salvar</button>

        <a th:href="@{/produtos}">Voltar</a>

    </form>

</div>

</body>
</html>
