<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Cadastro de Produto</h1>

    <form class="form-produto"
          th:action="@{/produtos/salvar}"
          th:object="${produto}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Nome:</label>
        <input type="text" th:field="*{nome}">
        <small th:errors="*{nome}"></small>

        <label>Preço:</label>
        <input type="number" step="0.01"
               th:field="*{preco}">
        <small th:errors="*{preco}"></small>

        <label>Estoque:</label>
        <input type="number" th:field="*{estoque}">
        <small th:errors="*{estoque}"></small>

        <button type="submit">Salvar</button>

        <a th:href="@{/produtos}">Voltar</a>

    </form>

</div>

</body>
</html>
